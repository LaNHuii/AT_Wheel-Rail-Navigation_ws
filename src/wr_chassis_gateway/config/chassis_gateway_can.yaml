cmd_vel_guard:
  ros__parameters:
    max_vx: 0.45
    max_vy: 0.45
    max_wz: 0.80
    command_timeout: 0.20
    publish_rate: 50.0

cmd_vel_arbiter:
  ros__parameters:
    source_timeout: 0.20
    chassis_timeout: 0.25
    publish_rate: 50.0

real_chassis_adapter:
  ros__parameters:
    transport: socketcan
    can_interface: can0
    session_id: 1
    command_rate: 50.0
    receive_rate: 500.0
    time_sync_rate: 1.0
    valid_for_ms: 200
    # Independent adapter watchdog. It must expire even if cmd_vel_guard exits.
    upstream_command_timeout: 0.25
    module_state_timeout: 0.20
    imu_frame_id: imu_link
    imu_angular_velocity_covariance_diagonal: [0.0004, 0.0004, 0.0004]
    imu_linear_acceleration_covariance_diagonal: [0.04, 0.04, 0.04]
    imu_orientation_covariance_diagonal: [0.01, 0.01, 0.02]
