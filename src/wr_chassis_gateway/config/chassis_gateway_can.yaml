# 真车 CAN 底盘网关参数。启用写入前必须确认接口名、波特率和 STM32 协议版本。
cmd_vel_guard:
  ros__parameters:
    max_vx: 0.45
    max_vy: 0.45
    max_wz: 0.80
    command_timeout: 0.20
    publish_rate: 50.0

cmd_vel_arbiter:
  ros__parameters:
    source_timeout: 0.20
    chassis_timeout: 0.25
    system_health_timeout: 0.40
    require_system_health: true
    publish_rate: 50.0

real_chassis_adapter:
  ros__parameters:
    transport: socketcan
    can_interface: can0
    session_id: 1
    command_rate: 50.0
    receive_rate: 500.0
    time_sync_rate: 1.0
    valid_for_ms: 200
    # 适配器独立看门狗；即使 cmd_vel_guard 退出，它也必须能自行超时停车。
    upstream_command_timeout: 0.25
    module_state_timeout: 0.20
    imu_frame_id: imu_link
    imu_angular_velocity_covariance_diagonal: [0.0004, 0.0004, 0.0004]
    imu_linear_acceleration_covariance_diagonal: [0.04, 0.04, 0.04]
    imu_orientation_covariance_diagonal: [0.01, 0.01, 0.02]
